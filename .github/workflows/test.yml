# master push / PR 시 API·웹 단위 테스트. 배포는 Cloud Build / Vercel이 담당한다.
name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API (dev extras for pytest)
        run: pip install -e ".[dev]"
      - name: pytest
        run: pytest tests/ -v
        env:
          HIKAGE_DATA_DIR: ${{ github.workspace }}/data/fixtures

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web
        run: npm ci
      - name: vitest
        run: npm test
