[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hikage-navi"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "shapely>=2.0",
  "pyproj>=3.6",
  "networkx>=3.3",
  "suncalc>=0.1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
preprocess = [
  "geopandas>=1.0",
  "osmnx>=1.9",
  "pyrosm>=0.6; python_version < '3.13'",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
